name: ci
on:
  pull_request:
  push:
    branches: [main, feat/chatgpt-deno-mcp]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/main.ts
      - run: deno test --allow-env --allow-net --unstable-kv tests/
